[package]
name = "fieldservice-account-erasure"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GDPR account erasure workflow for field-service sessions and credentials"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

